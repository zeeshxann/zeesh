<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Eco Sync Client Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
<style>
/* ============================================================
   Eco Sync — Client Desk
   Sand ground · near-black anchor · ink-navy accent
   Spacing scale: 4 / 8 / 16 / 24 / 32 / 48
   ============================================================ */
:root{
  color-scheme:light;

  /* ground */
  --sand:#F4EFE6;
  --sand-2:#EDE6D9;
  --sand-3:#E4DBCA;

  --bg:var(--sand);
  --surface:var(--sand-2);   /* cards + panels sit a shade deeper than the page */
  --surface-2:#E1D9C7;       /* inset wells inside a card */
  --surface-3:var(--sand-3);

  /* line */
  --line:#D6CCB9;
  --line-2:#E0D7C5;

  /* ink */
  --ink:#0E0F12;
  --ink-2:#3B3D43;
  --muted:#7A7468;

  /* accent */
  --navy:#1E3A5F;
  --accent:#1E3A5F;
  --accent-2:#2F5C93;
  --accent-ink:#F7F3EB;
  --accent-soft:#E2E6EC;

  /* status — muted to sit inside the sand palette */
  --good:#3D6B4F; --good-soft:#E3EADF;
  --warn:#8A5D1E; --warn-soft:#F1E7D3;
  --bad:#9B3A32;  --bad-soft:#F2E2DE;

  --shadow:0 1px 2px rgba(14,15,18,.04);
  --shadow-lift:0 1px 2px rgba(14,15,18,.05), 0 8px 24px -16px rgba(14,15,18,.3);

  --r:12px; --r-sm:8px; --r-xs:6px;

  --sans:Manrope,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Fraunces,ui-serif,Georgia,"Times New Roman",serif;
  --mono:var(--sans);

  --t:170ms cubic-bezier(.3,.7,.4,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E0F12;
  --surface:#16181C;
  --surface-2:#1B1E23;
  --surface-3:#22262C;
  --line:#2C3037;
  --line-2:#23272D;
  --ink:#F1EBE0;
  --ink-2:#CDC5B7;
  --muted:#8C8578;
  --navy:#84A7D4;
  --accent:#84A7D4;
  --accent-2:#A3C1E8;
  --accent-ink:#0E0F12;
  --accent-soft:#1A242F;
  --good:#6FA886; --good-soft:#18231C;
  --warn:#D2A055; --warn-soft:#2A2114;
  --bad:#D9756B;  --bad-soft:#2B1917;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lift:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0F12;
  --surface:#16181C;
  --surface-2:#1B1E23;
  --surface-3:#22262C;
  --line:#2C3037;
  --line-2:#23272D;
  --ink:#F1EBE0;
  --ink-2:#CDC5B7;
  --muted:#8C8578;
  --navy:#84A7D4;
  --accent:#84A7D4;
  --accent-2:#A3C1E8;
  --accent-ink:#0E0F12;
  --accent-soft:#1A242F;
  --good:#6FA886; --good-soft:#18231C;
  --warn:#D2A055; --warn-soft:#2A2114;
  --bad:#D9756B;  --bad-soft:#2B1917;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lift:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  font-family:var(--sans);color:var(--ink);
  font-size:14.5px;line-height:1.55;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num,input.mini-in{font-variant-numeric:tabular-nums;letter-spacing:-.012em}
::selection{background:var(--accent-soft);color:var(--ink)}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-weight:700;letter-spacing:.16em;font-size:13px}
.brand span{color:var(--muted);font-weight:500;font-size:13px;letter-spacing:0}
@media (max-width:640px){.brand span{display:none}}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:500}
.who img{width:24px;height:24px;border-radius:50%}
@media (max-width:640px){.who span{display:none}}

.wrap{max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:32px 72px}
@media (max-width:560px){.wrap,.top-in{padding-inline:16px}}

/* ---------- type ---------- */
h1{
  font-family:var(--serif);font-optical-sizing:auto;
  font-size:clamp(26px,3.4vw,34px);line-height:1.12;margin:0;font-weight:600;
  letter-spacing:-.018em;text-wrap:balance;
}
h2{font-size:14px;margin:0;font-weight:700;letter-spacing:-.008em}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:transparent;border-radius:var(--r-sm);
  padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);
  text-decoration:none;white-space:nowrap;
  transition:border-color var(--t),background var(--t),color var(--t);
}
.btn:hover{border-color:var(--ink-2);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--accent);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}

/* ---------- chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:999px;background:transparent;color:var(--ink-2);
  border:1px solid var(--line);white-space:nowrap;letter-spacing:-.002em;
}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
a.chip{text-decoration:none;transition:border-color var(--t),color var(--t)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}
a.chip.acc:hover{background:var(--accent-soft);filter:brightness(.98)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- KPIs ---------- */
.kpis{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--surface);margin-bottom:32px;
}
.kpi{padding:20px 24px;border-right:1px solid var(--line-2)}
.kpi:last-child{border-right:0}
.kpi .eyebrow{font-size:10px}
.kpi .v{
  font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.05;
  margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.kpi .s{font-size:12px;color:var(--muted);margin-top:6px}
.kpi .v.bad{color:var(--bad)}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{border-bottom:1px solid var(--line-2)}
  .kpi:nth-child(2n){border-right:0}
  .kpi:nth-last-child(-n+2){border-bottom:0}
  .kpi .v{font-size:26px}
}
@media (max-width:420px){.kpi{padding:16px}}

.grid-home{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:24px;align-items:start}
@media (max-width:920px){.grid-home{grid-template-columns:1fr}}

/* ---------- client cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(304px,1fr));gap:16px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:16px;
  transition:border-color var(--t),transform var(--t),box-shadow var(--t);
}
a.card:hover{border-color:var(--ink-2);transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.card .t{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.card .foot{
  display:flex;justify-content:space-between;gap:8px;align-items:center;
  border-top:1px solid var(--line-2);padding-top:16px;font-size:12.5px;margin-top:auto;
}
.next{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px}
.next b{font-weight:600}
.add-card{
  border:1px dashed var(--line);background:transparent;box-shadow:none;
  align-items:center;justify-content:center;color:var(--muted);font-weight:600;min-height:200px;
}
.add-card:hover{color:var(--accent);border-color:var(--accent);transform:none;box-shadow:none}

/* ---------- stage bar ---------- */
.sbar{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.sbar i{height:4px;border-radius:2px;background:var(--line)}
.sbar i.done{background:var(--navy)}
.sbar i.cur{background:var(--accent-2)}
.slabel{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;gap:8px;color:var(--muted)}
.slabel b{font-weight:600;color:var(--ink)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line-2)}
.panel-b{padding:16px 24px 20px}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
.panel{min-width:0}
@media (max-width:420px){.panel-h,.panel-b{padding-inline:16px}}

/* ---------- attention list ---------- */
.att{list-style:none;margin:0;padding:0}
.att li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.att li:last-child{border-bottom:0}
.att .c{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.att a{color:inherit;text-decoration:none}
.att a:hover .tt{color:var(--accent)}
.att .tt{transition:color var(--t)}
.empty{color:var(--muted);font-size:13px;padding:12px 0}

/* ---------- client page ---------- */
.back{font-size:12.5px;color:var(--muted);text-decoration:none;font-weight:600;display:inline-flex;gap:6px;margin-bottom:16px;transition:color var(--t)}
.back:hover{color:var(--accent)}
.stepper{display:grid;grid-template-columns:repeat(8,minmax(96px,1fr));gap:0;align-items:start;overflow-x:auto;margin:24px 0 32px;padding-bottom:4px}
.step{border:0;background:none;text-align:left;padding:0 12px 0 0;cursor:pointer;min-width:0;display:flex;flex-direction:column;align-self:start;height:100%}
.step:disabled{cursor:default}
.step .bar{height:4px;border-radius:2px;background:var(--line);margin-bottom:10px;transition:background var(--t)}
.step.done .bar{background:var(--navy)}
.step.cur .bar{background:var(--accent-2)}
.step .n{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.step .l{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.3;margin-top:4px;transition:color var(--t)}
.step.cur .l{color:var(--accent)}
.step .d{font-size:11px;color:var(--muted);margin-top:2px}
.step:not(:disabled):hover .l{color:var(--accent)}
.step:not(:disabled):hover .bar{background:var(--accent-2)}
.grid-client{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:24px;align-items:start}
.grid-client>*{min-width:0}
@media (max-width:1000px){.grid-client{grid-template-columns:minmax(0,1fr)}}

/* ---------- stage accordion ---------- */
.stg{border-bottom:1px solid var(--line-2)}
.stg:last-child{border-bottom:0}
.stg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 24px;transition:background var(--t)}
.stg>summary::-webkit-details-marker{display:none}
.stg>summary:hover{background:var(--surface-2)}
.stg>summary .nm{font-weight:600;flex:1;min-width:0}
.stg>summary .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stg>summary .car{color:var(--muted);transition:transform var(--t);font-size:10px}
.stg[open]>summary .car{transform:rotate(90deg)}
.stg.is-cur>summary .nm{color:var(--accent)}
.stg.is-cur>summary::before{content:"";position:absolute;left:0;width:2px;height:20px;background:var(--accent);border-radius:0 2px 2px 0}
.stg.is-cur>summary{position:relative}
.mini{width:52px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--navy)}
.tasks{list-style:none;margin:0;padding:0 24px 8px}
.task{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.task .tt{font-size:13.5px;line-height:1.45}
.task.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.task .sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center;min-width:0}
.task>div{min-width:0}
.mini-in{max-width:100%}
input.mini-in[type=date]{max-width:128px}
.task .rm{opacity:0;transition:opacity var(--t),color var(--t)}
.task:hover .rm,.task .rm:focus-visible{opacity:1}
@media (hover:none){.task .rm{opacity:.5}}
.gate{background:var(--navy);color:var(--accent-ink);font-size:9.5px;font-weight:700;letter-spacing:.1em;padding:2px 7px;border-radius:4px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 116px 136px auto;gap:8px;padding:8px 24px 20px}
@media (max-width:620px){.addrow{grid-template-columns:1fr 1fr;padding-inline:16px}.addrow input[type=text]{grid-column:1/-1}}
@media (max-width:420px){.tasks,.sugs{padding-inline:16px}}

/* ---------- inputs ---------- */
.in,select.in,textarea.in{
  width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);
  padding:8px 11px;font-size:13px;min-width:0;
  transition:border-color var(--t),box-shadow var(--t),background var(--t);
}
.in::placeholder{color:var(--muted)}
.in:hover{border-color:var(--ink-2)}
.in:focus{outline:none;border-color:var(--accent-2);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:72px;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}

/* ---------- payments ---------- */
.pay{width:100%;border-collapse:collapse;font-size:13px}
.pay td{padding:12px 0;border-bottom:1px solid var(--line-2);vertical-align:middle}
.pay tr:last-child td{border-bottom:0}
.pay td.a{text-align:right;padding-left:12px;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.pay td.s{text-align:right;padding-left:12px;width:1%}
.pay .lb{font-weight:600}
.pay .du{font-size:11.5px;color:var(--muted);margin-top:2px}
.paid-btn{
  border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;
  font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted);
  transition:border-color var(--t),color var(--t),background var(--t);
}
.paid-btn:hover{border-color:var(--accent);color:var(--accent)}
.paid-btn.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.paid-btn.late{color:var(--bad);border-color:var(--bad)}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.tot div{min-width:0}
.tot .v{overflow-wrap:anywhere}
.tot div{background:var(--surface-2);border-radius:var(--r-sm);padding:12px}
.tot .k{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tot .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.015em}

/* ---------- details ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere;text-align:right}

/* ---------- notes ---------- */
.notes{list-style:none;margin:16px 0 0;padding:0}
.note{padding:16px 0;border-top:1px solid var(--line-2);font-size:13px}
.note .by{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.note .by img{width:18px;height:18px;border-radius:50%}
.note .by b{color:var(--ink-2);font-weight:600}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}

/* ---------- banners ---------- */
.banner{
  border-radius:var(--r);padding:14px 16px;font-size:13px;margin-bottom:24px;
  display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  border:1px solid var(--line);background:var(--surface);
}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.banner.info{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.banner b{color:inherit;font-weight:700}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);
  font-size:13px;font-weight:600;z-index:50;box-shadow:var(--shadow-lift);
}
.skel{height:180px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- nav ---------- */
.topnav{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex-wrap:wrap;justify-content:center}
.topnav a{
  font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;
  padding:5px 14px;border-radius:999px;white-space:nowrap;transition:color var(--t),background var(--t);
}
.topnav a:hover{color:var(--ink)}
.topnav a.on{background:var(--ink);color:var(--bg)}
@media (max-width:560px){.topnav a{padding:5px 10px;font-size:12px}}
@media (max-width:680px){
  .top-in{flex-wrap:wrap;row-gap:10px;gap:12px}
  .topnav{order:10;width:100%;justify-content:center}
  .top .sp{order:1}
}

.themebtn{
  border:1px solid var(--line);background:transparent;border-radius:999px;
  width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--muted);
  transition:color var(--t),border-color var(--t);flex:none;
}
.themebtn:hover{color:var(--accent);border-color:var(--accent)}
.themebtn svg{width:15px;height:15px;display:block}
.themebtn .moon{display:none}

function setupItems(c){

function setupPct(c){ const it=setupItems(c).filter(x=>!x.na); if(!it.length) return 0; return Math.round(100*it.filter(x=>x.done).length/it.length); }
function thisPeriod(){ return todayISO().slice(0,7); }
function periodLabel(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"}); }
function shiftPeriod(ym,n){ let [y,m]=ym.split("-").map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"-"+String(m).padStart(2,"0"); }
function weekCount(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate()>28?5:4; }
function weekRange(ym,w){
  const [y,m]=ym.split("-").map(Number), last=new Date(y,m,0).getDate();
  const a=(w-1)*7+1, b=Math.min(w*7,last);
  return {from:a,to:w===weekCount(ym)?last:b};
}
function currentWeek(ym){ if(ym!==thisPeriod()) return 0; const d=new Date().getDate(); return Math.min(weekCount(ym),Math.ceil(d/7)); }
function runTicks(c,ym){ return ((c.run||{})[ym])||{}; }
function runItems(c,ym){
  const out=[];
  for(const sv of servicesOf(c)){
    const weekly=[], monthly=[];
    sv.reports.forEach(([nm,cad],i)=>{
      if(cad.indexOf("w")>=0) weekly.push({i,name:nm});
      if(cad.indexOf("m")>=0) monthly.push({i,name:nm});
    });
    out.push({svc:sv,weekly,monthly});
  }
  return out;
}
function runStats(c,ym){
  const t=runTicks(c,ym); let done=0,total=0;
  const wn=weekCount(ym), cw=currentWeek(ym), isNow=ym===thisPeriod();
  for(const {svc,weekly,monthly} of runItems(c,ym)){
    for(const r of weekly) for(let w=1;w<=wn;w++){
      if(isNow && w>cw) continue;
      total++; if(t[svc.id+":"+r.i+":w"+w]) done++;
    }
    for(const r of monthly){ total++; if(t[svc.id+":"+r.i+":m"]) done++; }
  }
  return {done,total,pct: total?Math.round(100*done/total):0};
}

function attRow(a){
  const when = a.d<0?`<span class="chip bad">${-a.d}d late</span>`: a.d===0?`<span class="chip warn">Today</span>`:`<span class="chip">${fmtDate(a.kind==="task"?a.t.due:a.p.due)}</span>`;
  const icon = a.kind==="pay"?`<span class="chip acc">₹</span>`:`<span class="chip">${esc((personName(a.t.owner)||"—").slice(0,1))}</span>`;
  const title = a.kind==="pay"? `${esc(a.p.label)} · <span class="num">${inr(a.p.amount)}</span>` : esc(a.t.title);
  return `<li>${icon}<a href="#c/${esc(a.c.id)}"><div class="tt">${title}</div><div class="c">${esc(a.c.name)}${a.kind==="task"&&a.t.owner?" · "+esc(personName(a.t.owner)):""}</div></a>${when}</li>`;
}
function svcChips(c,small){
  const on=servicesOf(c);
  return `<div class="row" style="gap:5px">${SERVICES.map(sv=>`<span class="svc ${on.includes(sv)?"on":""}" title="${esc(sv.n)}">${sv.ab}</span>`).join("")}</div>`;
}
function phaseBar(c){
  const p=phaseOf(c), idx=["proposal","setup","live"].indexOf(p);

}
function card(c){

      <span class="chip ${st.k}"><span class="dot"></span>${st.t}</span>

    <div>${phaseBar(c)}<div class="slabel"><span><b>${esc(statusOf(c).t)}</b>${c.tier||c.plan?" · "+esc(c.tier||c.plan):""}</span><span class="muted num">${phaseOf(c)==="live"?(()=>{const r=runStats(c,thisPeriod());return r.done+"/"+r.total+" this month";})():pct+"% setup"}</span></div></div>
    ${svcChips(c)}
    <div class="next">${nt?`<span class="muted">Next:</span><b>${esc(nt.title)}</b>`:`<span class="muted">${tasksOf(c).length?"No open tasks":"No tasks added yet"}</span>`}</div>
    <div class="row" style="gap:6px">
      <span class="chip acc" title="Partners are on every client">${esc(partnerLine())}</span>

      ${dl?`<span class="chip ${dl.d<0?"bad":dl.d<=3?"warn":""}">${dl.d<0?"Late · ":"Due "}${fmtDate(dl.due)}</span>`:`<span class="chip">No deadline set</span>`}

      <span>${c.monthlyFee?`<span class="num">${inr(c.monthlyFee)}</span><span class="muted">/mo</span>`:`<span class="muted">Fees not set</span>`}</span>
      <span class="row" style="gap:6px">${c.needsReview?`<span class="chip warn">Details to confirm</span>`:""}${ps.over?`<span class="chip bad">${inr(ps.over)} overdue</span>`:ps.pend?`<span class="chip">${inr(ps.pend)} due</span>`:paymentsOf(c).length?`<span class="chip good">All paid</span>`:""}</span>

/* ---------- render: client ---------- */
function renderClient(id){
  const c=S.clients[id];
  if(!S.loaded) return `<a class="back" href="#clients">← All clients</a><div class="skel"></div>`;
  if(!c) return `<a class="back" href="#clients">← All clients</a><div class="panel"><div class="panel-b">This client doesn't exist or was removed.</div></div>`;
  const st=statusOf(c), W=S.canWrite, ph=phaseOf(c);
  const tasks=tasksOf(c);
  const ym = S.period || thisPeriod();
  return `
  ${banner()}
  <a class="back" href="#clients">← All clients</a>
  ${c.needsReview?`<div class="banner warn"><span><b>Details to confirm.</b> Some of this client's information was filled in from earlier documents — check the stage, fees and payments, then confirm.</span>${W?`<button class="btn sm" data-a="confirm">Mark as confirmed</button>`:""}</div>`:""}
  <div class="head" style="margin-bottom:0">
    <div style="min-width:0">
      <div class="row" style="gap:8px"><span class="chip ${st.k}"><span class="dot"></span>${st.t}</span>${(c.tier||c.plan)?`<span class="chip">${esc(c.tier||c.plan)}</span>`:""}${(Number(c.outletCount)||0)>1?`<span class="chip">${c.outletCount} outlets</span>`:""}</div>
      <h1 style="margin-top:8px">${esc(c.name||"Untitled client")}</h1>
      <div class="muted" style="margin-top:2px">${esc([c.location,c.format,c.outlets].filter(Boolean).join(" · "))}</div>
    </div>
    <div class="row">
      <div class="panel" style="padding:10px 16px"><div class="eyebrow">Setup</div><div class="num" style="font-size:20px;font-weight:700">${setupPct(c)}%</div></div>
      ${ph==="live"?(()=>{const r=runStats(c,thisPeriod());return `<div class="panel" style="padding:10px 16px"><div class="eyebrow">This month</div><div class="num" style="font-size:20px;font-weight:700">${r.done}<span class="muted" style="font-weight:500">/${r.total}</span></div></div>`;})():""}
    </div>
  </div>

  <nav class="stepper phases" aria-label="Engagement phase">
    ${PHASES.map(([k,n,d])=>`<button class="step ${phaseIdx(ph)>phaseIdx(k)?"done":ph===k?"cur":""}" data-a="phase" data-p="${k}" ${W?"":"disabled"} title="${W?"Move to "+esc(n):esc(n)}">
      <div class="bar"></div><div class="l">${esc(n)}</div><div class="d">${esc(d)}</div></button>`).join("")}
  </nav>

  <div class="grid-client">
    <section class="stack">
      ${servicePanel(c)}
      ${setupPanel(c)}
      ${ph==="live"||ph==="hold"?runPanel(c,ym):""}
      ${tasksPanel(c,tasks)}
    </section>
    <div class="stack">
      ${paymentsPanel(c)}
      ${S.openQuote && c.quotes && c.quotes[S.openQuote] ? quoteDoc(c,{id:S.openQuote,...c.quotes[S.openQuote]}) : quotesPanel(c)}
      ${docsPanel(c)}
      ${detailsPanel(c)}
      ${notesPanel(c)}
      ${activityPanel(c)}
    </div>
  </div>`;
}
function phaseIdx(p){ return ["proposal","setup","live","hold"].indexOf(p); }

/* ---------- services subscribed ---------- */

  const t=TIERS[c.tier||c.plan];
  if(S.editing==="svc:"+c.id) return `<section class="panel"><div class="panel-h"><h2>Services</h2></div><div class="panel-b">
    <form class="fgrid" data-a="savesvc">
      <label class="f">Plan<select class="in" id="sv-tier" name="tier">${Object.keys(TIERS).map(k=>`<option ${k===(c.tier||c.plan)?"selected":""}>${k}</option>`).join("")}</select></label>

      <div class="full"><div class="eyebrow" style="margin-bottom:8px">Services included</div>
      <div class="svcpick">${SERVICES.map(sv=>`<label class="pick"><input type="checkbox" name="svc_${sv.id}" ${on.includes(sv)?"checked":""}>

          <div><b>${esc(sv.n)}</b><small>${esc(sv.blurb)}</small>
          <div class="muted" style="font-size:11.5px;margin-top:6px">${done}/${items.length} set up · ${sv.reports.length} report${sv.reports.length===1?"":"s"}</div></div></div>`;
      }).join("")}</div>`
      :`<div class="empty">No services chosen yet. ${W?"Pick a plan to set them.":""}</div>`}

/* ---------- setup board ---------- */
function setupPanel(c){
  const items=setupItems(c), W=S.canWrite, pct=setupPct(c);
  const groups=[]; for(const it of items){ const g=groups.find(x=>x[0].id===it.svc.id); if(g) g[1].push(it); else groups.push([it.svc,[it]]); }
  return `<section class="panel"><div class="panel-h"><h2>Setup</h2>
    <span class="muted" style="font-size:12px">${items.filter(x=>x.done).length} of ${items.filter(x=>!x.na).length} done</span></div>
    <div class="panel-b" style="padding-bottom:8px"><div class="bar-lg"><i style="width:${pct}%"></i></div></div>
    ${items.length? groups.map(([sv,list])=>`<details class="stg" data-key="${esc(c.id)}:su:${sv.id}" ${list.some(x=>!x.done&&!x.na)?"open":""}>
      <summary><span class="car">▶</span><span class="nm">${esc(sv.n)}</span>
        <span class="mini"><i style="width:${list.filter(x=>!x.na).length?Math.round(100*list.filter(x=>x.done).length/list.filter(x=>!x.na).length):0}%"></i></span>
        <span class="cnt num">${list.filter(x=>x.done).length}/${list.filter(x=>!x.na).length}</span></summary>
      <ul class="tasks">${list.map(it=>setupRow(c,it)).join("")}</ul>
      ${W?`<form class="addrow" data-a="addsetup" data-c="${esc(c.id)}" data-svc="${sv.id}">
        <input class="in" type="text" id="su-${esc(c.id)}-${sv.id}" name="name" placeholder="Add a setup item to ${esc(sv.n)}…" required>
        <select class="in" name="owner" aria-label="Owner">${ownerOpts(c.rep||"")}</select>
        <input class="in" type="date" name="due" aria-label="Due date">
        <button class="btn sm" type="submit">Add</button>
      </form>`:""}
    </details>`).join("")
    : `<div class="panel-b"><div class="empty">Choose the services above and the setup checklist builds itself.</div></div>`}
  </section>`;
}
function setupRow(c,it){
  const d=daysFrom(it.due), W=S.canWrite;
  const due = it.due? `<span class="chip ${!it.done&&d<0?"bad":!it.done&&d<=2?"warn":""}">${!it.done&&d<0?"Late · ":""}${fmtDate(it.due)}</span>`:"";
  return `<li class="task ${it.done?"done":""} ${it.na?"na":""}">
    <input type="checkbox" id="su-${esc(c.id)}-${esc(it.key)}" data-a="sutoggle" data-c="${esc(c.id)}" data-k="${esc(it.key)}" ${it.done?"checked":""} ${W&&!it.na?"":"disabled"} aria-label="${esc(it.name)}">
    <div><label class="tt" for="su-${esc(c.id)}-${esc(it.key)}">${esc(it.name)}</label>
      <div class="sub">
        ${W?`<select class="mini-in" data-a="suowner" data-c="${esc(c.id)}" data-k="${esc(it.key)}" aria-label="Owner">${ownerOpts(it.owner)}</select>
        <input class="mini-in" type="date" data-a="sudue" data-c="${esc(c.id)}" data-k="${esc(it.key)}" value="${esc(it.due||"")}" aria-label="Due date">`
        :`${it.owner?`<span class="chip">${esc(personName(it.owner))}</span>`:""}`}
        ${due}${it.na?`<span class="chip">Not applicable</span>`:""}</div></div>
    ${W?`<span class="row" style="gap:0;flex-wrap:nowrap">
      <button class="btn ghost sm rm" data-a="suna" data-c="${esc(c.id)}" data-k="${esc(it.key)}" title="${it.na?"Bring back":"Not applicable"}">${it.na?"↩":"∅"}</button>
      ${it.custom?`<button class="btn ghost sm rm" data-a="surm" data-c="${esc(c.id)}" data-k="${esc(it.key)}" title="Remove">&#10005;</button>`:""}</span>`:"<span></span>"}
  </li>`;
}

/* ---------- monthly run board ---------- */
function runPanel(c,ym){
  const wn=weekCount(ym), cw=currentWeek(ym), t=runTicks(c,ym), W=S.canWrite;
  const r=runStats(c,ym), items=runItems(c,ym);
  const isNow = ym===thisPeriod();
  return `<section class="panel"><div class="panel-h">
    <h2>Monthly run</h2>
    <div class="row" style="gap:6px">
      <button class="btn ghost sm" data-a="per" data-v="${shiftPeriod(ym,-1)}" aria-label="Previous month">←</button>
      <span class="chip">${esc(periodLabel(ym))}</span>
      <button class="btn ghost sm" data-a="per" data-v="${shiftPeriod(ym,1)}" aria-label="Next month">→</button>
      ${!isNow?`<button class="btn ghost sm" data-a="per" data-v="${thisPeriod()}">Today</button>`:""}
    </div></div>
    <div class="panel-b" style="padding-bottom:10px">
      <div class="bar-lg"><i style="width:${r.pct}%"></i></div>
      <div class="muted" style="font-size:12px;margin-top:8px">${r.done} of ${r.total} delivered${isNow?` · week ${cw} of ${wn}`:""}</div>
    </div>
    ${items.length? `<div class="panel-b" style="padding-top:0"><div class="tabwrap"><table class="runt">
      <thead><tr><th>Report</th>${Array.from({length:wn},(_,i)=>{const w=i+1,rg=weekRange(ym,w);
        return `<th class="wk ${isNow&&w===cw?"now":""}" title="${rg.from}–${rg.to}">W${w}</th>`;}).join("")}<th class="mo">Month</th></tr></thead>
      <tbody>
      ${items.map(({svc,weekly,monthly})=>{
        const rows=svc.reports.map((rp,i)=>{
          const isW=weekly.some(x=>x.i===i), isM=monthly.some(x=>x.i===i);
          return `<tr><td class="rn">${esc(rp[0])}</td>
            ${Array.from({length:wn},(_,k)=>{const w=k+1; if(!isW) return `<td class="na"></td>`;
              const key=svc.id+":"+i+":w"+w, on=!!t[key], fut=isNow&&w>cw;
              return `<td class="${isNow&&w===cw?"now":""}"><button class="tick ${on?"on":""} ${fut?"fut":""}" data-a="tick" data-c="${esc(c.id)}" data-ym="${ym}" data-k="${esc(key)}" ${W?"":"disabled"} title="${esc(rp[0])} — week ${w}" aria-pressed="${on}">${on?"✓":""}</button></td>`;}).join("")}
            <td class="mo">${isM?(()=>{const key=svc.id+":"+i+":m", on=!!t[key];
              return `<button class="tick ${on?"on":""}" data-a="tick" data-c="${esc(c.id)}" data-ym="${ym}" data-k="${esc(key)}" ${W?"":"disabled"} title="${esc(rp[0])} — monthly" aria-pressed="${on}">${on?"✓":""}</button>`;})():""}</td>
          </tr>`;
        }).join("");
        return `<tr class="svch"><td colspan="${wn+2}"><span class="ab">${svc.ab}</span>${esc(svc.n)}</td></tr>${rows}`;
      }).join("")}
      </tbody></table></div></div>`
    : `<div class="panel-b"><div class="empty">No services subscribed, so nothing is due.</div></div>`}
  </section>`;
}

        <input class="mini-in" type="date" data-a="due" data-c="${esc(c.id)}" data-t="${esc(t.id)}" id="dd-${esc(c.id)}-${esc(t.id)}" value="${esc(t.due||"")}" aria-label="Due date">`

function paymentsPanel(c){

    <div class="panel-h"><h2>Payments</h2>${W?`<div class="row" style="gap:6px">${c.monthlyFee?`<button class="btn sm" data-a="retainer">+ Next retainer</button>`:""}<button class="btn sm" data-a="paytoggle">+ Payment</button></div>`:""}</div>

      <div class="tot"><div><div class="k">Received</div><div class="v">${inr(st.rec)}</div></div><div><div class="k">Pending</div><div class="v">${inr(st.pend)}</div></div><div><div class="k">Overdue</div><div class="v" style="${st.over?"color:var(--bad)":""}">${inr(st.over)}</div></div></div>

        <div class="full row"><button class="btn primary sm" type="submit">Add payment</button><button class="btn ghost sm" type="button" data-a="cancel">Cancel</button></div>

      ${ps.length?`<table class="pay"><tbody>${ps.map(p=>{

function newClientDoc(f){

           payments.p_bal={label:"Setup balance (50%)",type:"setup",amount:fee-Math.round(fee/2),due:"",paid:false,created:now}; }
  return {name:f.name.trim(),location:f.location||"",format:f.format||"",outlets:f.outlets||"",pos:f.pos||"",
    tier, plan:tier, services, outletCount:Number(f.outletCount)||1, phase,

function banner(){
  if(S.dbOk===false) return `<div class="banner info"><span><b>Live data isn't available in this view.</b> Open this page from claude.ai while signed in to see and update client records.</span></div>`;
  if(!S.canWrite) return `<div class="banner info"><span>You have <b>view-only</b> access. Ask Zeeshan for edit access to update progress.</span></div>`;
  let lateT=0, lateI=0;
  for(const c of Object.values(S.clients)){
    for(const t of openTasks(c)){ const d=daysFrom(t.due); if(d!==null&&d<0) lateT++; }
    for(const pm of paymentsOf(c)){ if(pm.paid) continue; const d=daysFrom(pm.due); if(d!==null&&d<0) lateI++; }
  }
  if(lateT||lateI) return `<div class="banner warn"><span><b>${lateT?lateT+" task"+(lateT>1?"s":"")+" overdue":""}${lateT&&lateI?" and ":""}${lateI?lateI+" payment"+(lateI>1?"s":"")+" past due":""}.</b> Everything late is marked in red across the desk.</span>${lateI?`<a class="btn sm" href="#money">Open Money</a>`:""}</div>`;
  return "";
}


/* ---------- deadlines & people ---------- */
function nextDeadline(c){
  const withDue=openTasks(c).filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due));
  if(!withDue.length) return null;
  return {due:withDue[0].due, d:daysFrom(withDue[0].due), t:withDue[0]};
}
function tasksFor(pid){
  const out=[];
  for(const c of Object.values(S.clients)) for(const t of openTasks(c)) if((t.owner||"")===pid) out.push({c,t,d:daysFrom(t.due)});
  return out.sort((a,b)=>{ const A=a.t.due||"9999", B=b.t.due||"9999"; return A.localeCompare(B); });
}
function unassignedTasks(){
  const out=[];
  for(const c of Object.values(S.clients)) for(const t of openTasks(c)) if(!t.owner) out.push({c,t,d:daysFrom(t.due)});
  return out.sort((a,b)=>(a.t.due||"9999").localeCompare(b.t.due||"9999"));
}
function clientsFor(p){
  const all=Object.values(S.clients).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  return isPartner(p)? all : all.filter(c=>c.rep===p.id);
}

function renderHub(){
  if(!S.loaded) return `<div class="skel"></div>`;
  const cs=Object.values(S.clients);
  const live=cs.filter(c=>phaseOf(c)==="live").length;
  const setup=cs.filter(c=>phaseOf(c)==="setup").length;
  const prop=cs.filter(c=>phaseOf(c)==="proposal").length;

  let pend=0, over=0, lateT=0, due7=0, unbilled=0, openT=0;
  const att=[];
  for(const c of cs){
    const ps=payStats(c); pend+=ps.pend; over+=ps.over;
    for(const t of openTasks(c)){ openT++; const d=daysFrom(t.due);
      if(d!==null&&d<0) lateT++; if(d!==null&&d<=7){ due7++; att.push({kind:"task",c,t,d}); } }
    for(const pm of paymentsOf(c)){ if(pm.paid) continue; if(!pm.invNo) unbilled++;

    </div>
    ${viewTog("hub")}
  </div>

  <div class="quick">
    <span class="ql">Start something</span>
    ${S.canWrite?`<a class="btn primary sm" href="#new">+ New client</a>`:""}
    <a class="btn sm" href="#money">Invoice register</a>
    <a class="btn sm" href="#money/quotes">Quotations</a>
    <a class="btn sm" href="#activity">What changed</a>
  </div>

  ${LAY==="list"
    ? `<ul class="hublist">${tiles.map(([href,k,v,cls,n,sfoot])=>`<li><a href="${href}">
        <span class="hk">${esc(k)}</span>

        <span class="hn">${esc(n)}<small>${esc(sfoot)}</small></span>
        <span class="go">&rarr;</span></a></li>`).join("")}</ul>
       <div style="height:32px"></div>`
    : `<div class="hub">${tiles.map(([href,k,v,cls,n,sfoot])=>`<a class="tile" href="${href}">
        <div class="tk">${esc(k)}</div>

        <div class="ts"><span>${esc(sfoot)}</span><span class="go">&rarr;</span></div>

  <div class="grid-home">

      <div class="panel-b">
        ${att.length?`<ul class="att">${att.slice(0,10).map(attRow).join("")}</ul>`:`<div class="empty">Nothing due in the next seven days.</div>`}

/* ---------- invoices ---------- */
function invoicesAll(){
  const out=[];
  for(const c of Object.values(S.clients)) for(const p of paymentsOf(c)) if(p.invNo) out.push({c,p,d:daysFrom(p.due)});
  return out.sort((a,b)=>(b.p.issuedOn||"").localeCompare(a.p.issuedOn||""));
}
function invStatus(p,d){
  if(p.paid) return ["Paid","good"];
  if(!p.sent) return ["Raised",""];
  if(d!==null && d<0) return [(-d)+"d overdue","bad"];
  return ["Sent","acc"];
}

  const unbilled=[]; for(const c of Object.values(S.clients)) for(const p of paymentsOf(c)) if(!p.invNo&&!p.paid) unbilled.push({c,p});
  return `${banner()}

      ${invs.map(({c,p,d})=>{const st=invStatus(p,d);

      </tbody></table>`:`<div class="empty">No invoices raised yet. Open a client, then raise an invoice against any payment.</div>`}</div></div></section>
  ${unbilled.length?`<section class="panel" style="margin-top:24px"><div class="panel-h"><h2>Waiting to be invoiced</h2><span class="chip warn">${unbilled.length}</span></div>
    <div class="panel-b"><ul class="tl">${unbilled.map(({c,p})=>`<li><a href="#c/${esc(c.id)}"><div class="tt">${esc(p.label)}</div><div class="c">${esc(c.name)}</div></a><span class="chip">${inr(p.amount)}</span></li>`).join("")}</ul></div></section>`:""}
  `}`;

/* ---------- activity ---------- */
function renderActivity(){
  if(!S.loaded) return `<div class="skel"></div>`;
  const es=feed(200);
  const days=[]; for(const e of es){ const d=(e.at||"").slice(0,10); const g=days.find(x=>x[0]===d); if(g) g[1].push(e); else days.push([d,[e]]); }
  return `${banner()}
  <div class="head"><div><div class="eyebrow">Who changed what</div><h1>Activity</h1>
    <div class="muted" style="margin-top:4px">Every change made in the desk, newest first. Names come from who signed in.</div></div></div>
  <section class="panel"><div class="panel-b">
    ${es.length? days.map(([d,list])=>`<div class="daylabel">${esc(dayLabel(d))}</div><ul class="feed">${list.map(feedRow).join("")}</ul>`).join("")
    : `<div class="empty">Nothing recorded yet. Changes start appearing here as soon as anyone updates a client.</div>`}
  </div></section>`;
}
function dayLabel(d){ const t=todayISO(); if(d===t) return "Today";
  const y=new Date(t+"T00:00:00"); y.setDate(y.getDate()-1);
  if(d===y.toISOString().slice(0,10)) return "Yesterday"; return fmtDate(d); }
function feedRow(e){
  return `<li><span class="who">${esc(initials(e.name||"Team"))}</span>
    <div><div class="tx"><b>${esc(e.name||"Team")}</b> ${esc(e.text)}</div>
    ${e.client?`<div class="cx"><a href="#c/${esc(e.client)}">${esc(e.clientName||"Client")}</a></div>`:""}</div>
    <span class="wh">${esc(clock(e.at))}</span></li>`;
}
function clock(ts){ try{ return new Date(ts).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } }

/* ---------- main render ---------- */
function render(){
  const r=route(), app=document.getElementById("app");
  // preserve focus + typed values across re-render
  const act=document.activeElement, fid=act&&act.id, sel=act&&act.selectionStart;
  const vals={}; app.querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{ if(el.type!=="checkbox") vals[el.id]=el.value; });
  if(!S.unlocked){
    app.innerHTML = renderLock();
    document.getElementById("topnav").innerHTML="";
    document.body.classList.add("locked");
    for(const [id,v] of Object.entries(vals)){ const el=document.getElementById(id); if(el && el.type!=="checkbox") el.value=v; }
    if(fid){ const el=document.getElementById(fid); if(el) el.focus(); }
    return;
  }
  document.body.classList.remove("locked");
  app.innerHTML = r.view==="client"? renderClient(r.id) : r.view==="new"? renderNew() : r.view==="team"? renderTeam(r.who)
    : r.view==="money"? renderMoney(r.tab) : r.view==="activity"? renderActivity() : r.view==="manual"? renderManual()
    : r.view==="clients"? renderHome() : renderHub();
  renderNav(r.view);
  for(const [id,v] of Object.entries(vals)){ const el=document.getElementById(id); if(el && el.type!=="checkbox") el.value=v; }
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel);}catch(_){} } }
  resolveProfiles();
}
async function resolveProfiles(){
  if(!userNs) return;
  const ids=new Set(); for(const c of Object.values(S.clients)) for(const n of notesOf(c)) if(n.by) ids.add(n.by);
  const need=[...ids]; if(!need.length) return;
  const ps=await userNs.profiles(need);
  let changed=false; for(const id of need){ const p=ps[id]; if(p && (!S.profiles[id] || S.profiles[id].name!==p.name)){ S.profiles[id]={name:p.name,avatarUrl:p.avatarUrl}; changed=true; } }
  if(changed) render();
}

/* ---------- events ---------- */
document.getElementById("app").addEventListener("toggle",e=>{ const d=e.target; if(d.matches&&d.matches("details.stg")) S.open[d.dataset.key]=d.open; },true);
document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b || b.tagName==="FORM") return;
  const r=route(); const a=b.dataset.a; const id=b.dataset.c||r.id; const c=id&&S.clients[id];
  if(a==="toggle"){ const t=c.tasks[b.dataset.t]; const done=!t.done; write(id,{tasks:{[b.dataset.t]:{done,doneAt:done?new Date().toISOString():""}}}); log("task",(done?"completed":"reopened")+" <"+t.title+">",id); return; }

    if(cls.length) msg+="\n"+cls.length+" client"+(cls.length>1?"s":"")+" will have no rep.";

    for(const x of cls) write(x.id,{rep:""});
    const byC={}; for(const x of xs){ (byC[x.c.id]=byC[x.c.id]||{})[x.t.id]={owner:""}; }
    for(const [cid,body] of Object.entries(byC)) write(cid,{tasks:body});
    S.editing=null;
    writeTeam({[pr.id]:{deleted:true}}).then(()=>toast(pr.name+" removed from the team"));

    if(r.view==="team"&&r.who===pr.id) location.hash="#team"; else render();
    return; }
  if(a==="phase"){ const v=b.dataset.p; if(v===phaseOf(c)) return;
    write(id,{phase:v,phaseDates:{[v]:todayISO()}}).then(()=>toast("Moved to "+phaseName(v)));
    log("phase","moved this client to "+phaseName(v),id); return; }
  if(a==="per"){ S.period=b.dataset.v; render(); return; }
  if(a==="editsvc"){ S.editing="svc:"+id; render(); return; }
  if(a==="sutoggle"){ const k=b.dataset.k, cur=(c.setup||{})[k]||{}, done=!cur.done;
    write(id,{setup:{[k]:{done,doneAt:done?new Date().toISOString():""}}});
    const nm=(setupItems(c).find(x=>x.key===k)||{}).name||k;
    log("setup",(done?"completed setup item \u201c":"reopened setup item \u201c")+nm+"\u201d",id); return; }
  if(a==="suna"){ const k=b.dataset.k, cur=(c.setup||{})[k]||{};
    write(id,{setup:{[k]:{na:!cur.na}}}); return; }
  if(a==="surm"){ if(confirm("Remove this setup item?")) write(id,{setup:{[b.dataset.k]:{removed:true}}}); return; }
  if(a==="tick"){ const ym=b.dataset.ym, k=b.dataset.k, t=runTicks(c,ym), on=!t[k];
    write(id,{run:{[ym]:{[k]:on?{by:S.actor||"",at:new Date().toISOString()}:null}}});
    if(on){ const [sid,ri,per]=k.split(":"); const sv=SVC[sid];
      const nm=sv?sv.reports[Number(ri)][0]:k;
      log("report","delivered "+nm+" \u2014 "+(per==="m"?"monthly":"week "+per.slice(1))+", "+periodLabel(ym),id); }
    return; }
  if(a==="paid"){ const p=c.payments[b.dataset.p]; const paid=!p.paid; write(id,{payments:{[b.dataset.p]:{paid,paidOn:paid?todayISO():""}}}); log("payment",(paid?"recorded payment of ":"reopened ")+inr(p.amount)+" — "+p.label,id); return; }
  if(a==="paytoggle"){ S.editing=S.editing==="pay:"+id?null:"pay:"+id; render(); const el=document.getElementById("pl-"+id); el&&el.focus(); return; }
  if(a==="editdet"){ S.editing="det:"+id; render(); return; }
  if(a==="layout"){ if(S.layout[b.dataset.k]===b.dataset.v) return; setLayout(b.dataset.k,b.dataset.v); render(); return; }
  if(a==="goto"){ if(e.target.closest("a")) return; location.hash=b.dataset.h; return; }
  if(a==="sug"){ const el=document.getElementById("nt-"+b.dataset.c+"-"+b.dataset.i); if(el){ el.value=b.dataset.v; el.focus(); } return; }

  /* --- documents --- */
  if(a==="loaddocs"){
    const body={}; let n=0;
    for(const [g,items] of DOC_PACK) for(const nm of items){ body[rid("d")]={name:nm,group:g,status:"pending",order:++n}; }
    write(id,{docs:body}).then(()=>{ toast("Standard document pack loaded"); log("doc","loaded the standard document pack",id); });
    return; }
  if(a==="docst"){ const d=c.docs[b.dataset.d]; const v=b.dataset.v; if(!d||d.status===v) return;
    write(id,{docs:{[b.dataset.d]:{status:v,at:new Date().toISOString()}}});
    if(v==="received") log("doc","marked <"+d.name+"> as received",id);
    else if(v==="na") log("doc","marked <"+d.name+"> as not applicable",id);
    return; }
  if(a==="rmdoc"){ const d=c.docs[b.dataset.d];
    if(confirm("Remove this document from the list?")){ write(id,{docs:{[b.dataset.d]:{deleted:true}}}); log("doc","removed <"+((d&&d.name)||"a document")+"> from the document list",id); }
    return; }

  /* --- quotations --- */
  if(a==="newquote"){ S.quoteEdit=null; S.openQuote=null; S.editing="quote:"+id; render(); const el=document.getElementById("q-tier"); el&&el.focus(); return; }
  if(a==="openquote"){ S.openQuote=b.dataset.q; S.editing=null; render(); return; }
  if(a==="closequote"){ S.openQuote=null; render(); return; }
  if(a==="qedit"){ S.quoteEdit={id:b.dataset.q,...c.quotes[b.dataset.q]}; S.openQuote=null; S.editing="quote:"+id; render(); return; }
  if(a==="qstat"){ const q=c.quotes[b.dataset.q]; const v=b.dataset.v;
    write(id,{quotes:{[b.dataset.q]:{status:v,statusAt:new Date().toISOString()}}}).then(()=>toast("Quotation marked "+v));
    log("quote","marked quotation "+((q&&q.no)||"")+" as "+v,id); return; }
  if(a==="qaccept"){ const qid=b.dataset.q, q=c.quotes[qid]; if(!q) return;
    const setup=Number(q.setup)||0, monthly=Number(q.monthly)||0;
    const body={quotes:{[qid]:{status:"accepted",statusAt:new Date().toISOString()}},
      setupFee:setup, monthlyFee:monthly, plan:q.tier||c.plan||""};
    const has=paymentsOf(c).some(x=>x.type==="setup");
    if(setup && !has){ const now=new Date().toISOString();
      body.payments={p_adv:{label:"Setup advance (50%)",type:"setup",amount:Math.round(setup/2),due:todayISO(),paid:false,created:now},
        p_bal:{label:"Setup balance (50%)",type:"setup",amount:setup-Math.round(setup/2),due:"",paid:false,created:now}}; }
    write(id,body).then(()=>toast("Accepted — fees and setup payments written to this client"));
    log("quote","recorded quotation "+(q.no||"")+" as accepted — "+inr(setup)+" setup, "+inr(monthly)+" a month",id);
    return; }
  if(a==="rmquote"){ const q=c.quotes[b.dataset.q];
    if(confirm("Delete this quotation?")){ S.openQuote=null; write(id,{quotes:{[b.dataset.q]:{deleted:true}}}).then(()=>toast("Quotation deleted"));
      log("quote","deleted quotation "+((q&&q.no)||""),id); }
    return; }

  /* --- invoices --- */
  if(a==="raiseinv"){ const pm=c.payments[b.dataset.p]; if(!pm||pm.invNo) return;
    b.disabled=true; b.textContent="Raising…";
    nextNumber("inv").then(no=>{ if(!no){ b.disabled=false; b.textContent="Raise invoice"; return; }
      write(id,{payments:{[b.dataset.p]:{invNo:no,issuedOn:todayISO(),sent:false}}}).then(()=>toast("Invoice "+no+" raised"));
      log("invoice","raised invoice "+no+" for "+inr(pm.amount)+" — "+pm.label,id);
    });
    return; }
  if(a==="sendinv"){ const pm=c.payments[b.dataset.p]; if(!pm) return;
    write(id,{payments:{[b.dataset.p]:{sent:true,sentOn:todayISO()}}}).then(()=>toast("Marked as sent"));
    log("invoice","marked invoice "+(pm.invNo||"")+" as sent",id); return; }
  if(a==="edittask"){ S.editing="task:"+b.dataset.t; render(); const el=document.getElementById("et-"+b.dataset.t); if(el){el.focus();el.select();} return; }
  if(a==="cancel"){ S.editing=null; render(); return; }
  if(a==="confirm"){ write(id,{needsReview:false}).then(()=>toast("Marked as confirmed")); log("client","confirmed this client\u2019s details",id); return; }
  if(a==="rmnote"){ if(confirm("Delete this note?")){ write(id,{notes:{[b.dataset.n]:{deleted:true}}}); log("note","deleted a note",id); } return; }

  if(a==="retainer"){
    const ms=paymentsOf(c).filter(p=>p.type==="monthly"&&p.period).map(p=>p.period).sort();
    let y,m; if(ms.length){ [y,m]=ms[ms.length-1].split("-").map(Number); m++; if(m>12){m=1;y++;} } else { const d=new Date(); y=d.getFullYear(); m=d.getMonth()+1; }
    const period=y+"-"+String(m).padStart(2,"0"); const last=new Date(y,m,0).getDate();
    const label="Retainer — "+new Date(y,m-1,1).toLocaleDateString("en-IN",{month:"short",year:"numeric"});
    const pid="p_m"+y+String(m).padStart(2,"0");
    write(id,{payments:{[pid]:{label,type:"monthly",period,amount:Number(c.monthlyFee)||0,due:period+"-"+String(last).padStart(2,"0"),paid:false,deleted:false,created:new Date().toISOString()}}}).then(()=>toast(label+" added"));
    log("payment","added "+label+" \u2014 "+inr(Number(c.monthlyFee)||0),id);
    return;
  }
});
document.getElementById("app").addEventListener("submit",e=>{
  const f=e.target; if(!f.dataset.a) return; e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries()); const r=route(); const a=f.dataset.a; const id=f.dataset.c||fd.client||r.id;
  if(a==="unlock"){
    const code=(fd.code||"").trim(), who=fd.actor||"";
    if(!who){ S.lockErr="Choose your name so changes can be attributed."; render(); return; }
    if(code.toLowerCase()!==accessCode().toLowerCase()){ S.lockErr="That code isn\u2019t right. Check with Zeeshan or Shahama."; render(); return; }
    S.lockErr=""; S.unlocked=true; S.actor=who; saveSession(who);
    render(); toast("Welcome back, "+personName(who));
    log("session","opened the desk");
    return; }
  if(a==="adddoc"){ const name=(fd.name||"").trim(); if(!name||!id) return;
    const did=rid("d"); const order=Math.max(0,...docsOf(S.clients[id]).map(x=>x.order||0))+1;
    f.reset(); write(id,{docs:{[did]:{name,group:"Other",status:"pending",order}}}).then(()=>toast("Document added"));
    log("doc","added <"+name+"> to the document list",id); return; }
  if(a==="savequote"){
    const cl=S.clients[id]; if(!cl) return;
    const qid=f.dataset.q;
    const body={tier:fd.tier||"Custom", setup:Number(fd.setup)||0, monthly:Number(fd.monthly)||0,
      lines:(fd.lines||"").trim(), terms:(fd.terms||"").trim(), valid:fd.valid||""};
    S.editing=null; S.quoteEdit=null;
    if(qid){
      write(id,{quotes:{[qid]:body}}).then(()=>toast("Quotation saved"));
      S.openQuote=qid; render();
      log("quote","edited quotation "+((cl.quotes[qid]&&cl.quotes[qid].no)||""),id);
    } else {
      const nid=rid("q");
      nextNumber("quote").then(no=>{
        write(id,{quotes:{[nid]:{...body,no:no||"",date:todayISO(),status:"draft",created:new Date().toISOString()}}})
          .then(()=>{ S.openQuote=nid; render(); toast("Quotation "+(no||"")+" created"); });
        log("quote","raised quotation "+(no||"")+" \u2014 "+inr(body.setup)+" setup, "+inr(body.monthly)+" a month",id);
      });
      render();
    }
    return; }
  if(a==="addtask"){ const title=(fd.title||"").trim(); if(!title) return;
    const cl=S.clients[id]; if(!cl){ toast("Pick a client first."); return; }
    const owner = (f.dataset.owner!=null&&f.dataset.owner!=="") ? f.dataset.owner : (fd.owner||"");
    const tid=rid("t");
    const order=Math.max(0,...tasksOf(cl).map(t=>t.order||0))+1;
    f.reset();
    write(id,{tasks:{[tid]:{title,owner,due:fd.due||"",done:false,order}}}).then(()=>toast("Task added"));
    log("task","added \u201c"+title+"\u201d"+(owner?" for "+personName(owner):""),id);
    return; }
  if(a==="addsetup"){ const name=(fd.name||"").trim(); if(!name||!id) return;
    const key=f.dataset.svc+":c"+Date.now().toString(36).slice(-5);
    f.reset();
    write(id,{setup:{[key]:{custom:true,name,owner:fd.owner||"",due:fd.due||"",done:false}}}).then(()=>toast("Setup item added"));
    log("setup","added setup item \u201c"+name+"\u201d",id); return; }
  if(a==="savesvc"){ const cl=S.clients[id]; if(!cl) return;
    const tier=fd.tier||"Standard", t=TIERS[tier]||TIERS.Standard;
    const services={}; for(const sv of SERVICES) services[sv.id]=!!fd["svc_"+sv.id];
    if(!Object.values(services).some(Boolean)) for(const x of t.services) services[x]=true;
    S.editing=null;
    const body={tier,plan:tier,services,outletCount:Number(fd.outletCount)||1};
    if(!cl.setupFee && t.setup) body.setupFee=t.setup;
    if(!cl.monthlyFee && t.monthly) body.monthlyFee=t.monthly;
    write(id,body).then(()=>toast("Services saved"));
    log("client","set the plan to "+tier+" \u2014 "+SERVICES.filter(x=>services[x.id]).map(x=>x.n).join(", "),id);
    render(); return; }
  if(a==="saveperson"){
    const name=(fd.name||"").trim(); if(!name) return;
    const cur=f.dataset.p?personById(f.dataset.p):null;
    const pid=f.dataset.p||("p_"+(name.toLowerCase().replace(/[^a-z0-9]+/g,"")||"x")+"_"+Date.now().toString(36).slice(-4));
    const order=cur?(cur.order||0):(Math.max(0,...teamPeople().map(x=>x.order||0))+1);
    S.editing=null;
    writeTeam({[pid]:{name,role:(fd.role||"").trim(),owns:(fd.owns||"").trim(),kind:fd.kind==="partner"?"partner":"rep",order,deleted:false}})
      .then(()=>toast(cur?(cur.name!==name?cur.name+" is now "+name:"Saved"):name+" added to the team"));
    log("team",cur?(cur.name!==name?"renamed "+cur.name+" to "+name:"updated "+name+"\u2019s details"):"added "+name+" to the team");
    render(); return; }
  if(a==="addpay"){ const pid=rid("p"); S.editing=null; write(id,{payments:{[pid]:{label:fd.label.trim(),type:"other",amount:Number(fd.amount)||0,due:fd.due||"",paid:false,created:new Date().toISOString()}}}).then(()=>toast("Payment added")); log("payment","added a payment line \u2014 "+fd.label.trim()+", "+inr(Number(fd.amount)||0),id); render(); return; }
  if(a==="savedet"){ const body={}; for(const [k,,,type] of FIELDS){ body[k]= type==="number"? (Number(fd[k])||0) : (fd[k]||"").trim(); } if(!body.name) return; S.editing=null; write(id,body).then(()=>toast("Details saved")); log("client","updated the client details",id); render(); return; }
  if(a==="savetask"){ const tid=f.dataset.t; const title=(fd.title||"").trim(); if(!title) return; S.editing=null;
    write(id,{tasks:{[tid]:{title,owner:fd.owner||"",due:fd.due||""}}}).then(()=>toast("Task updated")); log("task","edited <"+title+">",id); render(); return; }
  if(a==="addnote"){ const text=(fd.text||"").trim(); if(!text) return; const nid=rid("n"); f.reset(); write(id,{notes:{[nid]:{text,at:new Date().toISOString(),by:S.uid||null,author:personName(S.actor)||""}}}); log("note","added a note",id); return; }
  if(a==="create"){ if(!db){ toast("Live data isn't connected in this view."); return; }
    const btn=document.getElementById("n-submit"); btn.disabled=true; btn.textContent="Creating…";
    const ref=db.collection("clients").doc(); const doc=newClientDoc(fd);
    ref.set(doc).then(()=>{ toast(doc.name+" added"); log("client","added "+doc.name+" as a client",ref.id); location.hash="#c/"+ref.id; })
      .catch(err=>{ btn.disabled=false; btn.textContent="Create client"; toast(err&&err.code==="quota_exceeded"?"The desk is full — remove an old client first.":"Couldn't create the client — try again."); });
    return; }
});

  if(a==="suowner"||a==="sudue"){ const id2=el.dataset.c||route().id; if(!id2) return;
    write(id2,{setup:{[el.dataset.k]: a==="suowner"?{owner:el.value}:{due:el.value}}}); return; }
  if(a!=="owner"&&a!=="due") return;
  const id=el.dataset.c||route().id; if(!id) return;
  const cl=S.clients[id], tk=cl&&cl.tasks&&cl.tasks[el.dataset.t];
  write(id,{tasks:{[el.dataset.t]: a==="owner"?{owner:el.value}:{due:el.value}}});
  if(tk) log("task", a==="owner"? "assigned \u201c"+tk.title+"\u201d to "+(personName(el.value)||"nobody")
    : (el.value? "set \u201c"+tk.title+"\u201d due "+fmtDate(el.value) : "cleared the deadline on \u201c"+tk.title+"\u201d"), id);
});

/* ---------- theme ---------- */
(function(){
  var root=document.documentElement, btn=document.getElementById("themebtn");
  var saved=null; try{ saved=localStorage.getItem("ecosync-theme"); }catch(e){}
  if(saved==="dark"||saved==="light") root.setAttribute("data-theme",saved);
  var lb=document.getElementById("lockbtn");
  lb.addEventListener("click",function(){ endSession(); location.hash=""; render(); toast("Desk locked"); });
  btn.addEventListener("click",function(){
    var dark = root.getAttribute("data-theme")==="dark" ||
      (!root.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme:dark)").matches);
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme",next);
    try{ localStorage.setItem("ecosync-theme",next); }catch(e){}
  });
})();

/* ---------- boot ---------- */
render();
(async()=>{
  const use = window.claude && window.claude.use;
  if(!use){ S.dbOk=false; S.loaded=true; render(); return; }
  const [d,u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  db=d; userNs=u;
  if(!db){ S.dbOk=false; S.loaded=true; render(); return; }
  S.dbOk=true;
  if(userNs){
    const me=await userNs.me(); S.uid=me.id; S.me=me;
    const cw=await userNs.can("data.write"); if(cw===false) S.canWrite=false;
    const w=document.getElementById("who");
    if(me.id){ w.innerHTML=`<img alt="" src="${esc(me.avatarUrl)}"><span></span>`; w.querySelector("span").textContent=me.name||"You"; }
    S._meName=me.name||"";
  }
  db.collection("settings").onSnapshot(snap=>{
    const all={}; for(const d of snap.docs) all[d.id]={id:d.id,...d.data()};
    S.settings=all;
    const t=all.team||null;
    S.team = t || {people:{}};
    const empty = !t || !t.people || !Object.keys(t.people).length;
    if(empty && S.canWrite && !S._seedTried){ S._seedTried=true;
      db.doc("settings/team").set({people:JSON.parse(JSON.stringify(DEFAULT_PEOPLE)),updatedAt:new Date().toISOString()}).catch(()=>{}); }
    if(!all.access && S.canWrite && !S._accTried){ S._accTried=true;
      db.doc("settings/access").set({code:DEFAULT_CODE,updatedAt:new Date().toISOString()}).catch(()=>{}); }
    S.teamLoaded=true;
    const sess=readSession();
    if(sess && !S.unlocked && personById(sess.actor)){ S.unlocked=true; S.actor=sess.actor; }
    render();
  }, ()=>{ S.team={people:{}}; S.teamLoaded=true; render(); });
  db.collection("activity").onSnapshot(snap=>{
    const all={}; for(const d of snap.docs) all[d.id]=d.data()||{};
    S.activity=all; if(S.unlocked) render();
  }, ()=>{});
  db.collection("clients").onSnapshot(snap=>{
    const next={}; for(const d of snap.docs){ next[d.id]={id:d.id,...d.data()}; }
    S.clients=next; S.loaded=true; render();
  }, err=>{ S.loaded=true; toast("Lost connection to live data — reload the page."); render(); });
})();
</script>
